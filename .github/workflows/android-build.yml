name: Android CI/CD Build Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Didea.headless=true"
      GRADLE_OPTS: "-Djava.awt.headless=true -Didea.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Create Empty .env File
        run: touch .env

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          set -e -o pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            app/build/generated/
          if-no-files-found: ignore

      - name: Get Current Date
        id: date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Package and Rename APK
        run: |
          mkdir -p build-outputs
          echo "=== Searching for generated APKs ==="
          find app/build/outputs -type f -name "*.apk" || true
          APK_PATH=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No APK found in app/build/outputs!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "build-outputs/navirom-debug-${{ env.CURRENT_DATE }}.apk"
          cp "$APK_PATH" "build-outputs/navirom-debug.apk"
          ls -la build-outputs/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: navirom-debug-apk
          path: build-outputs/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Build (${{ env.CURRENT_DATE }})"
          body: "Automated Android debug build APK generated by GitHub Actions CI/CD."
          draft: false
          prerelease: false
          files: build-outputs/navirom-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
